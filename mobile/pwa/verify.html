<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Verifying — The Executive</title>
<style>
  body {
    background: #080600;
    color: #E8E0CC;
    font-family: -apple-system, system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    text-align: center;
    padding: 24px;
  }
  .card { max-width: 380px; }
  h1 { font-family: Georgia, serif; color: #D4AF37; font-size: 22px; margin-bottom: 14px; }
  p { color: rgba(232,224,204,0.7); font-size: 14px; line-height: 1.6; margin-bottom: 24px; }
  a {
    display: inline-block;
    background: #D4AF37;
    color: #080600;
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 14px 32px;
    border-radius: 24px;
    text-decoration: none;
  }
</style>
</head>
<body>
<div class="card">
  <h1 id="status-title">Verifying your email...</h1>
  <p id="status-text">One moment.</p>
  <a href="/" id="enter-link" style="display: none;">Enter the Boardroom</a>
</div>

<script>
  const API_BASE = 'https://the-executive-backend.onrender.com/api';

  function getEmailFromHash() {
    const hash = window.location.hash.substring(1);
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');
    if (!accessToken) return null;

    try {
      const payload = accessToken.split('.')[1];
      const decoded = JSON.parse(atob(payload.replace(/-/g, '+').replace(/_/g, '/')));
      return decoded.email;
    } catch (e) {
      return null;
    }
  }

  async function verify() {
    const email = getEmailFromHash();
    const titleEl = document.getElementById('status-title');
    const textEl = document.getElementById('status-text');
    const linkEl = document.getElementById('enter-link');

    if (!email) {
      titleEl.textContent = 'Verification link invalid';
      textEl.textContent = 'This link may have expired. Try signing up again.';
      return;
    }

    try {
      const response = await fetch(`${API_BASE}/auth/confirm-email`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await response.json();

      if (data.success) {
        titleEl.textContent = 'Email verified';
        textEl.textContent = 'You can now sign in to The Executive.';
        linkEl.style.display = 'inline-block';
      } else {
        titleEl.textContent = 'Something went wrong';
        textEl.textContent = 'Try signing in — if it still fails, contact support.';
      }
    } catch (e) {
      titleEl.textContent = 'Something went wrong';
      textEl.textContent = 'Try signing in — if it still fails, contact support.';
    }
  }

  verify();
</script>
</body>
</html>
