<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Reset Password — The Executive</title>
  <style>
    body { background: #0a0a0a; color: #f5f5f5; font-family: Georgia, serif; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .box { max-width: 380px; padding: 40px; background: #141414; border: 1px solid #2a2a2a; border-radius: 8px; text-align: center; }
    input { width: 100%; padding: 12px; margin: 10px 0; background: #1e1e1e; border: 1px solid #333; border-radius: 4px; color: #f5f5f5; box-sizing: border-box; }
    button { width: 100%; padding: 14px; background: #c9a84a; color: #0a0a0a; border: none; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 10px; }
    .error { color: #e05555; font-size: 13px; margin-top: 8px; }
    a { color: #c9a84a; }
  </style>
</head>
<body>
  <div class="box">
    <h2 id="title">Reset your password</h2>
    <div id="form-area">
      <input type="password" id="new-password" placeholder="New password" />
      <input type="password" id="confirm-password" placeholder="Confirm new password" />
      <button onclick="submitReset()">SET NEW PASSWORD</button>
      <p id="error" class="error"></p>
    </div>
    <div id="result-area" style="display:none;"></div>
  </div>

  <script>
    const API_BASE = 'https://the-executive-backend.onrender.com/api';

    function getTokenPayload() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      const token = params.get('access_token');
      if (!token) return null;
      const payload = JSON.parse(atob(token.split('.')[1]));
      return payload;
    }

    const payload = getTokenPayload();
    if (!payload) {
      document.getElementById('form-area').style.display = 'none';
      document.getElementById('result-area').style.display = 'block';
      document.getElementById('result-area').innerHTML = '<p class="error">This reset link is invalid or expired.</p>';
    }

    async function submitReset() {
      const newPassword = document.getElementById('new-password').value;
      const confirmPassword = document.getElementById('confirm-password').value;
      const errorEl = document.getElementById('error');
      errorEl.textContent = '';

      if (!newPassword || newPassword.length < 8) {
        errorEl.textContent = 'Password must be at least 8 characters.';
        return;
      }
      if (newPassword !== confirmPassword) {
        errorEl.textContent = 'Passwords do not match.';
        return;
      }

      try {
        const response = await fetch(`${API_BASE}/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user_id: payload.sub, new_password: newPassword })
        });
        const data = await response.json();
        if (data.success) {
          document.getElementById('form-area').style.display = 'none';
          document.getElementById('result-area').style.display = 'block';
          document.getElementById('result-area').innerHTML = '<p>Password updated. <a href="/">Sign in now</a></p>';
        } else {
          errorEl.textContent = 'Something went wrong. Try the link again.';
        }
      } catch {
        errorEl.textContent = 'Connection failed. Try again.';
      }
    }
  </script>
</body>
</html>
